<svg viewBox="0 0 720 200" xmlns="http://www.w3.org/2000/svg" font-family="monospace, sans-serif">
  <rect width="720" height="200" fill="#f8f9fa" rx="10"/>
  <text x="360" y="28" text-anchor="middle" font-size="13" font-weight="bold" fill="#444">GraphQL — Cliente Define o que Precisa</text>

  <!-- Client -->
  <rect x="30" y="70" width="130" height="60" rx="8" fill="#1D4ED8"/>
  <text x="95" y="97" text-anchor="middle" font-size="12" fill="white" font-weight="bold">Client</text>
  <text x="95" y="113" text-anchor="middle" font-size="10" fill="#bfdbfe">define a query</text>

  <!-- Single endpoint box -->
  <rect x="290" y="62" width="140" height="76" rx="8" fill="#7C3AED"/>
  <text x="360" y="82" text-anchor="middle" font-size="11" fill="white" font-weight="bold">Single Endpoint</text>
  <text x="360" y="97" text-anchor="middle" font-size="12" fill="#e9d5ff" font-weight="bold">POST /graphql</text>
  <text x="360" y="113" text-anchor="middle" font-size="10" fill="#e9d5ff">Query</text>
  <text x="360" y="127" text-anchor="middle" font-size="10" fill="#e9d5ff">Mutation · Subscription</text>

  <!-- Server -->
  <rect x="560" y="70" width="130" height="60" rx="8" fill="#15803D"/>
  <text x="625" y="92" text-anchor="middle" font-size="12" fill="white" font-weight="bold">Server</text>
  <text x="625" y="107" text-anchor="middle" font-size="10" fill="#d1fae5">resolvers</text>
  <text x="625" y="120" text-anchor="middle" font-size="10" fill="#d1fae5">schema typed</text>

  <!-- Query example -->
  <rect x="30" y="148" width="300" height="38" rx="6" fill="white" stroke="#1D4ED8" stroke-width="1"/>
  <text x="40" y="162" font-size="10" fill="#1D4ED8" font-weight="bold">Query:</text>
  <text x="40" y="177" font-size="10" fill="#374151">{ user(id:1) { name email posts { title } } }</text>

  <!-- Response example -->
  <rect x="390" y="148" width="300" height="38" rx="6" fill="white" stroke="#15803D" stroke-width="1"/>
  <text x="400" y="162" font-size="10" fill="#15803D" font-weight="bold">Response:</text>
  <text x="400" y="177" font-size="10" fill="#374151">{ "user": { "name": "Jeff", "email": "..." } }</text>

  <!-- Arrows -->
  <line x1="160" y1="93" x2="288" y2="93" stroke="#1D4ED8" stroke-width="2" marker-end="url(#gqb)"/>
  <line x1="430" y1="93" x2="558" y2="93" stroke="#7C3AED" stroke-width="2" marker-end="url(#gqp)"/>
  <line x1="558" y1="107" x2="430" y2="107" stroke="#15803D" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#gqg)"/>
  <line x1="288" y1="107" x2="160" y2="107" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#gqgr)"/>

  <text x="224" y="88" text-anchor="middle" font-size="10" fill="#1D4ED8">query</text>
  <text x="494" y="88" text-anchor="middle" font-size="10" fill="#7C3AED">resolve</text>
  <text x="494" y="120" text-anchor="middle" font-size="10" fill="#15803D">data</text>
  <text x="224" y="120" text-anchor="middle" font-size="10" fill="#6B7280">response</text>

  <defs>
    <marker id="gqb" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#1D4ED8"/></marker>
    <marker id="gqp" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#7C3AED"/></marker>
    <marker id="gqg" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#15803D"/></marker>
    <marker id="gqgr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#6B7280"/></marker>
  </defs>
</svg>
