openapi: "3.0.3"
info:
  title: User API
  version: "1.0.0"
paths:
  /api/v1/users:
    get:
      summary: List users
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
  /api/v1/users/{id}:
    get:
      summary: Find user by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User found
        "404":
          description: Not found
components:
  schemas:
    User:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
