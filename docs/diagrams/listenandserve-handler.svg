<svg viewBox="0 0 760 260" xmlns="http://www.w3.org/2000/svg" font-family="monospace, sans-serif">
  <rect width="760" height="260" fill="#f8f9fa" rx="10"/>
  <text x="380" y="26" text-anchor="middle" font-size="13" font-weight="bold" fill="#374151">O que ListenAndServe aceita como handler</text>

  <!-- ListenAndServe box -->
  <rect x="240" y="42" width="280" height="48" rx="8" fill="#1D4ED8"/>
  <text x="380" y="63" text-anchor="middle" font-size="12" fill="white" font-weight="bold">http.ListenAndServe(addr, handler)</text>
  <text x="380" y="80" text-anchor="middle" font-size="10" fill="#bfdbfe">handler precisa implementar http.Handler</text>

  <!-- Center line down -->
  <line x1="380" y1="90" x2="380" y2="110" stroke="#1D4ED8" stroke-width="1.5"/>

  <!-- Interface box -->
  <rect x="270" y="110" width="220" height="36" rx="6" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="380" y="126" text-anchor="middle" font-size="11" fill="#5B21B6" font-weight="bold">interface http.Handler</text>
  <text x="380" y="140" text-anchor="middle" font-size="10" fill="#5B21B6">ServeHTTP(w, r)</text>

  <!-- Branch lines -->
  <line x1="380" y1="146" x2="380" y2="162" stroke="#7C3AED" stroke-width="1.5"/>
  <line x1="100" y1="162" x2="660" y2="162" stroke="#7C3AED" stroke-width="1.5"/>
  <line x1="100" y1="162" x2="100" y2="180" stroke="#7C3AED" stroke-width="1.5"/>
  <line x1="273" y1="162" x2="273" y2="180" stroke="#7C3AED" stroke-width="1.5"/>
  <line x1="487" y1="162" x2="487" y2="180" stroke="#7C3AED" stroke-width="1.5"/>
  <line x1="660" y1="162" x2="660" y2="180" stroke="#7C3AED" stroke-width="1.5"/>

  <!-- nil / DefaultServeMux -->
  <rect x="30" y="180" width="140" height="64" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="100" y="198" text-anchor="middle" font-size="11" fill="#991B1B" font-weight="bold">nil</text>
  <text x="100" y="214" text-anchor="middle" font-size="10" fill="#991B1B">usa DefaultServeMux</text>
  <text x="100" y="228" text-anchor="middle" font-size="9" fill="#DC2626">cuidado em producao</text>
  <text x="100" y="241" text-anchor="middle" font-size="9" fill="#9CA3AF">pacotes externos podem</text>

  <!-- http.HandlerFunc -->
  <rect x="198" y="180" width="150" height="64" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="273" y="198" text-anchor="middle" font-size="11" fill="#92400E" font-weight="bold">HandlerFunc</text>
  <text x="273" y="214" text-anchor="middle" font-size="10" fill="#92400E">funcao adaptada</text>
  <text x="273" y="228" text-anchor="middle" font-size="10" fill="#92400E">para Handler</text>
  <text x="273" y="241" text-anchor="middle" font-size="9" fill="#9CA3AF">http.HandlerFunc(fn)</text>

  <!-- http.NewServeMux -->
  <rect x="412" y="180" width="150" height="64" rx="6" fill="#DCFCE7" stroke="#15803D" stroke-width="1.5"/>
  <text x="487" y="198" text-anchor="middle" font-size="11" fill="#166534" font-weight="bold">ServeMux</text>
  <text x="487" y="214" text-anchor="middle" font-size="10" fill="#166534">roteador dedicado</text>
  <text x="487" y="228" text-anchor="middle" font-size="10" fill="#166534">recomendado</text>
  <text x="487" y="241" text-anchor="middle" font-size="9" fill="#9CA3AF">http.NewServeMux()</text>

  <!-- Custom type -->
  <rect x="585" y="180" width="150" height="64" rx="6" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="660" y="198" text-anchor="middle" font-size="11" fill="#5B21B6" font-weight="bold">Custom type</text>
  <text x="660" y="214" text-anchor="middle" font-size="10" fill="#5B21B6">struct com</text>
  <text x="660" y="228" text-anchor="middle" font-size="10" fill="#5B21B6">ServeHTTP(w, r)</text>
  <text x="660" y="241" text-anchor="middle" font-size="9" fill="#9CA3AF">composicao e middleware</text>
</svg>
